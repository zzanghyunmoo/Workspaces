name: GitHub-native work
description: Create a tracked work item with links to its repository and review evidence.
title: "[Work] "
labels:
  - "status:planned"
body:
  - type: markdown
    attributes:
      value: |
        This Issue is a concise work index. Link the target repository, pull requests,
        verification, and any project-owned documentation without copying full prose here.

  - type: textarea
    id: objective
    attributes:
      label: 목표와 문제
      description: 해결할 문제와 완료 후 바뀌어야 할 결과를 짧게 적습니다.
      placeholder: 문제, 대상 사용자, 예상 결과
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위와 비범위
      description: 포함할 변경과 명시적으로 제외할 경계를 적습니다.
      placeholder: |
        포함:
        -
        제외:
        -
    validations:
      required: true

  - type: input
    id: repositories
    attributes:
      label: 대상 repository
      description: 영향받는 OWNER/REPO를 쉼표로 구분합니다.
      placeholder: zzanghyunmoo/Workspaces
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 작업 링크와 완료 증거
      description: 프로젝트 문서, PR, 검증 결과와 공개 노트 링크를 작업이 진행될 때 갱신합니다.
      placeholder: |
        - Project documentation:
        - Pull request:
        - Verification:
        - Public note (optional):

  - type: textarea
    id: pull_requests
    attributes:
      label: Canonical PR index
      description: 아래 marker 사이에 이 티켓의 모든 PR을 한 줄에 하나씩 추가합니다. marker를 지우지 마세요.
      value: |
        <!-- compound-pr-index:start -->
        <!-- Add one entry per PR: - https://github.com/OWNER/REPO/pull/N -->
        <!-- compound-pr-index:end -->

  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: Issue와 공개 문서에 token, secret, 내부 host, 개인 로컬 경로를 남기지 않았습니다.
          required: true
